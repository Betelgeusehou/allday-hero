<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Archivo:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F6F1EA; --ink:#1B1613; --block:#2A1F1A; --red:#94280C;
    --muted:#6B625B; --line:#E3DBD0; --cream:#F6F1EA; --dim:#C9BDB0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0E0B09}
  body{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* Height is reserved before paint, so nothing shifts.
     The gradient is also the no-WebGL / no-JS resting frame. */
  .hero{
    position:relative;width:100%;
    height:100vh;height:100svh;min-height:520px;
    overflow:hidden;display:flex;align-items:center;
    background:radial-gradient(62% 58% at 68% 46%,
      #9a4414 0%, #4a1f0d 22%, #241A15 48%, #140F0C 74%, #0E0B09 100%);
  }
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* Keeps the type side in shadow so the light reads as a light. */
  .veil{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(90deg,
      rgba(14,11,9,.78) 0%, rgba(14,11,9,.46) 36%, rgba(14,11,9,.06) 66%, rgba(14,11,9,0) 82%)}

  /* Hands off to the paper page underneath without a seam. */
  .foot{position:absolute;left:0;right:0;bottom:0;height:104px;pointer-events:none;z-index:3;
    background:linear-gradient(180deg, rgba(246,241,234,0) 0%, rgba(246,241,234,0) 46%, rgba(246,241,234,.28) 76%, var(--paper) 100%)}

  .inner{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;
    padding:0 clamp(20px,5vw,56px) 72px}

  .eyebrow{margin:0 0 14px;font-size:13px;line-height:1.5;letter-spacing:.12em;
    text-transform:uppercase;font-weight:600;color:var(--dim);max-width:36ch}
  .rule{height:1px;width:0;background:var(--red);margin:0 0 26px}
  h1{margin:0 0 30px;font-family:Newsreader,Georgia,serif;font-weight:500;
    font-size:clamp(2.1rem,6.5vw,4.75rem);line-height:1.03;letter-spacing:-.015em;
    color:var(--cream);text-wrap:balance}
  .ln{display:block;overflow:hidden;padding-bottom:.04em}
  .ln>i{display:block;font-style:normal;transform:translateY(106%)}

  .cta{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:0;
    font-size:16px;font-weight:600;text-decoration:none;white-space:nowrap;
    transition:background .18s ease,color .18s ease}
  .btn.solid{background:var(--red);color:#fff;border:1px solid var(--red)}
  .btn.solid:hover{background:#7d210a;border-color:#7d210a}
  .btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--dim)}
  .btn.ghost:hover{background:rgba(246,241,234,.10)}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes wipe{to{width:88px}}
  @keyframes rise{to{transform:translateY(0)}}
  .eyebrow{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) .15s forwards}
  .rule{animation:wipe .5s cubic-bezier(.2,.7,.2,1) .42s forwards}
  .ln>i{animation:rise .75s cubic-bezier(.16,1,.3,1) forwards}
  .ln:nth-child(1)>i{animation-delay:.50s}
  .ln:nth-child(2)>i{animation-delay:.62s}
  .cta{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) 1.02s forwards}

  @media (max-width:767px){
    .veil{background:linear-gradient(180deg,
      rgba(14,11,9,.18) 0%, rgba(14,11,9,.62) 46%, rgba(14,11,9,.88) 100%)}
    .inner{padding-bottom:52px}
    .btn{height:48px;padding:0 18px;font-size:15px}
    .foot{height:76px}
  }

  @media (prefers-reduced-motion:reduce){
    .eyebrow,.cta{opacity:1;animation:none}
    .rule{width:88px;animation:none}
    .ln>i{transform:none;animation:none}
    .btn{transition:none}
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="inner">
    <p class="eyebrow">Practical AI for restaurant operators, from a restaurant owner.</p>
    <div class="rule" aria-hidden="true"></div>
    <h1><span class="ln"><i>The AI I run my</i></span><span class="ln"><i>restaurants with.</i></span></h1>
    <div class="cta">
      <a class="btn solid" target="_top" href="https://www.chriscusack.net/forms/363ffbe2-9228-41d0-adc7-10bbf15bd28b">Start the free class</a>
      <a class="btn ghost" target="_top" href="https://www.chriscusack.net/forms/9a623499-b2ca-4284-8c05-9b63acff72ab">Pre-register for the community</a>
    </div>
  </div>
  <div class="foot" aria-hidden="true"></div>
</section>

<script>
(function(){
  "use strict";

  /* Switch the look here: EMBER | DAWN | SMOKE */
  var MODE = "EMBER";

  var MODES = { EMBER:0, DAWN:1, SMOKE:2 };
  var canvas = document.getElementById("gl");
  var hero   = document.getElementById("hero");
  var gl = null;
  try {
    gl = canvas.getContext("webgl", {alpha:false, antialias:false, depth:false,
                                     stencil:false, powerPreference:"low-power"})
      || canvas.getContext("experimental-webgl");
  } catch(e){ gl = null; }

  /* No WebGL: the CSS gradient on .hero is already the resting frame. */
  if(!gl){ canvas.style.display = "none"; return; }

  var VERT =
    "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}";

  var FRAG = [
    "#ifdef GL_FRAGMENT_PRECISION_HIGH",
    "precision highp float;",
    "#else",
    "precision mediump float;",
    "#endif",
    "uniform vec2 u_res;uniform float u_time;uniform vec2 u_light;uniform float u_mode;",

    "float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*0.1031);q+=dot(q,q.yzx+33.33);",
    "return fract((q.x+q.y)*q.z);}",

    "float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);",
    "return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),",
    "mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}",

    "float fbm(vec2 p){float v=0.0,a=0.5;",
    "for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+11.3;a*=0.5;}return v;}",

    "void main(){",
    "vec2 uv=gl_FragCoord.xy/u_res;float ar=u_res.x/u_res.y;",
    "vec2 p=vec2(uv.x*ar,uv.y);vec2 lp=vec2(u_light.x*ar,u_light.y);float t=u_time;",

    /* domain-warped noise, scrolling up: air moving in front of a light */
    "float warp=fbm(p*2.0+vec2(0.0,-t*0.10));",
    "float heat=fbm(p*1.7+warp*1.05+vec2(0.0,-t*0.17));",

    "float lum;float emberOn=0.0;",
    "float edge=(heat-0.5)*0.075;",
    "if(u_mode<0.5){",
      "float d=distance(p,lp)-edge;",
      "lum=exp(-d*d*12.0)*0.92+exp(-d*3.2)*0.20;",
      "lum*=0.55+heat*0.70;emberOn=1.0;",
    "}else if(u_mode<1.5){",
      "float sweep=0.5+0.42*sin(t*0.06);float b=abs(uv.x-sweep);",
      "lum=(exp(-b*b*26.0)*1.00+exp(-b*4.5)*0.16)*smoothstep(1.20,0.05,uv.y);",
      "lum*=0.58+heat*0.66;",
    "}else{",
      "float d=distance(p,lp)-edge*1.6;",
      "lum=exp(-d*d*3.2)*0.70+0.045;",
      "lum*=0.50+heat*0.95;",
    "}",

    /* ramp: near-black, espresso, ember red, amber, warm white */
    "vec3 c0=vec3(0.047,0.037,0.031);vec3 c1=vec3(0.106,0.086,0.074);",
    "vec3 c2=vec3(0.420,0.125,0.038);vec3 c3=vec3(0.880,0.420,0.120);",
    "vec3 c4=vec3(1.000,0.780,0.520);",
    "vec3 col=mix(c0,c1,smoothstep(0.00,0.22,lum));",
    "col=mix(col,c2,smoothstep(0.20,0.55,lum));",
    "col=mix(col,c3,smoothstep(0.55,0.88,lum));",
    "col=mix(col,c4,smoothstep(1.00,1.42,lum));",

    "if(emberOn>0.5){float em=0.0;",
    "for(int i=0;i<10;i++){float fi=float(i);float s=hash(vec2(fi*1.7,2.3));",
    "float sp=0.030+s*0.045;",
    "float x=fract(s*6.7)*ar+sin(t*0.30+fi*1.7)*0.05;",
    "float y=fract(s*2.9+t*sp);",
    "float life=smoothstep(0.0,0.10,y)*(1.0-smoothstep(0.48,0.95,y));",
    "float dd=distance(p,vec2(x,y));",
    "em+=life/(1.0+dd*dd*6500.0)*(0.65+0.35*sin(t*2.6+fi*2.1));}",
    "col+=vec3(1.0,0.50,0.18)*em*0.72;}",

    "float vig=smoothstep(1.30,0.30,length((uv-0.5)*vec2(ar,1.0)*1.30));",
    "col*=0.30+0.70*vig;",
    "col=col/(1.0+max(max(col.r,col.g),col.b)*0.55);",
    "float g=hash(gl_FragCoord.xy+fract(t)*vec2(17.3,9.7));",
    "col+=(g-0.5)*0.030;",
    "col+=(hash(gl_FragCoord.xy*0.37)-0.5)*0.004;",
    "gl_FragColor=vec4(col,1.0);}"
  ].join("\n");

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if(!vs || !fs){ canvas.style.display = "none"; return; }

  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(prog)); canvas.style.display = "none"; return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes   = gl.getUniformLocation(prog, "u_res");
  var uTime  = gl.getUniformLocation(prog, "u_time");
  var uLight = gl.getUniformLocation(prog, "u_light");
  var uMode  = gl.getUniformLocation(prog, "u_mode");
  gl.uniform1f(uMode, MODES[MODE] === undefined ? 0 : MODES[MODE]);

  /* The canvas is atmosphere and the type is DOM, so the backing store
     stays below the screen's pixel ratio on purpose. */
  var scale = 1;
  function isSmall(){ return window.innerWidth < 768; }
  function baseScale(){
    return Math.min(window.devicePixelRatio || 1, isSmall() ? 1.0 : 1.5);
  }

  function resize(){
    var w = Math.max(1, Math.round(canvas.clientWidth  * baseScale() * scale));
    var h = Math.max(1, Math.round(canvas.clientHeight * baseScale() * scale));
    if(canvas.width !== w || canvas.height !== h){
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h);
    }
  }

  /* Light: follows the cursor on a pointer device, drifts on its own otherwise. */
  var tx = 0.70, ty = 0.58, cx = 0.70, cy = 0.58;
  var lastTouch = 0;

  function track(x, y){
    var r = hero.getBoundingClientRect();
    tx = (x - r.left) / r.width;
    ty = 1 - (y - r.top) / r.height;
    lastTouch = performance.now();
  }
  window.addEventListener("pointermove", function(e){
    track(e.clientX, e.clientY);
  }, {passive:true});
  /* Safari on iOS still needs the touch events. */
  function fromTouch(e){ var t = e.touches && e.touches[0]; if(t) track(t.clientX, t.clientY); }
  window.addEventListener("touchstart", fromTouch, {passive:true});
  window.addEventListener("touchmove",  fromTouch, {passive:true});

  var reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var visible = true, onScreen = true, running = false, start = 0, raf = 0;

  /* Adaptive quality: if frames run long, drop the backing store once. */
  var slow = 0, stepped = false;

  function frame(now){
    raf = 0;
    if(!start) start = now;
    var t = (now - start) / 1000;
    resize();

    /* Drifts on its own until a finger or cursor takes over, and again 3s after it leaves. */
    if(now - lastTouch > 3000){
      tx = 0.66 + Math.sin(t * 0.11) * 0.13;
      ty = 0.66 + Math.cos(t * 0.08) * 0.10;
    }
    cx += (tx - cx) * 0.045;
    cy += (ty - cy) * 0.045;

    gl.uniform2f(uLight, cx, cy);
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if(!stepped){
      var dt = now - (frame.last || now); frame.last = now;
      if(dt > 22){ slow++; } else if(slow > 0){ slow--; }
      if(slow > 25){ stepped = true; scale = 0.7; resize(); }
    }
    if(running) raf = requestAnimationFrame(frame);
  }

  function play(){
    if(running || reduced) return;
    running = true;
    if(!raf) raf = requestAnimationFrame(frame);
  }
  function pause(){
    running = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
  }
  function sync(){ (visible && onScreen) ? play() : pause(); }

  document.addEventListener("visibilitychange", function(){
    visible = !document.hidden; sync();
  });
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(entries){
      onScreen = entries[0].isIntersecting; sync();
    }, {threshold:0}).observe(hero);
  }
  window.addEventListener("resize", function(){
    resize();
    if(!running) { gl.uniform2f(uLight, cx, cy); gl.uniform1f(uTime, 0); gl.drawArrays(gl.TRIANGLES,0,3); }
  }, {passive:true});

  resize();
  if(reduced){
    /* One frame, then stop. */
    gl.uniform2f(uLight, 0.70, 0.58);
    gl.uniform1f(uTime, 12.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else {
    sync();
  }
})();
</script>

</body>
</html>
