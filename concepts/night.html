<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Day concept The night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Archivo:wght@400;600&display=swap">
<style>
:root{--red:#94280C;--cream:#F6F1EA;--dim:#C9BDB0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0E0B09}
body{font-family:Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;display:flex;align-items:center}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(90deg,rgba(14,11,9,.88) 0%,rgba(14,11,9,.62) 30%,rgba(14,11,9,.08) 58%,rgba(14,11,9,0) 74%)}
.inner{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,56px) 40px}
.eyebrow{margin:0 0 14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--dim);max-width:34ch;line-height:1.5}
.rule{height:1px;width:88px;background:var(--red);margin:0 0 26px}
h1{margin:0;font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(2.1rem,6.3vw,4.6rem);line-height:1.03;letter-spacing:-.015em;color:var(--cream)}
h1 span{display:block}
.tag{position:absolute;left:0;bottom:0;z-index:4;padding:16px clamp(20px,5vw,56px);
 font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6B625B}
</style></head><body>
<section class="hero"><canvas id="c"></canvas><div class="veil"></div>
<div class="inner">
 <p class="eyebrow">Practical AI for restaurant operators, from a restaurant owner.</p>
 <div class="rule"></div>
 <h1><span>The AI I run my</span><span>restaurants with.</span></h1>
</div>
<div class="tag">The night</div></section>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=0,H=0;
function fit(){var d=Math.min(window.devicePixelRatio||1,2);
 if(c.clientWidth!==W||c.clientHeight!==H||c.width!==Math.round(c.clientWidth*d)){
  W=c.clientWidth;H=c.clientHeight;c.width=Math.round(W*d);c.height=Math.round(H*d);
  x.setTransform(d,0,0,d,0,0);}}
function ground(cx,cy,warm){var g=x.createRadialGradient(W*cx,H*cy,0,W*cx,H*cy,W*0.78);
 g.addColorStop(0,warm);g.addColorStop(0.55,'#1a1310');g.addColorStop(1,'#0E0B09');
 x.fillStyle=g;x.fillRect(0,0,W,H);}

function curve(u){
  return 0.10
   + 0.30*Math.exp(-Math.pow(u-0.22,2)/0.012)
   + 0.98*Math.exp(-Math.pow(u-0.62,2)/0.030)
   + 0.18*Math.exp(-Math.pow(u-0.85,2)/0.010);
}
function draw(t){
  ground(0.68,0.56,'#271a13');
  var x0=W*0.47,x1=W*0.96,base=H*0.80,amp=H*0.56;
  var prog=Math.min(1,((t*0.26)%1.5));
  var N=170;

  x.strokeStyle='rgba(201,189,176,.14)';x.lineWidth=1;
  x.beginPath();x.moveTo(x0,base);x.lineTo(x1,base);x.stroke();

  // area under the night
  x.beginPath();x.moveTo(x0,base);
  for(var i=0;i<=N;i++){var u=i/N;if(u>prog)break;
    x.lineTo(x0+(x1-x0)*u,base-curve(u)*amp);}
  x.lineTo(x0+(x1-x0)*Math.min(1,prog),base);x.closePath();
  var g=x.createLinearGradient(0,base-amp,0,base);
  g.addColorStop(0,'rgba(232,144,60,.26)');g.addColorStop(1,'rgba(232,144,60,0)');
  x.fillStyle=g;x.fill();

  // the night itself
  x.strokeStyle='rgba(246,241,234,.95)';x.lineWidth=2.2;x.beginPath();
  for(var i2=0;i2<=N;i2++){var u2=i2/N;if(u2>prog)break;
    var px=x0+(x1-x0)*u2,py=base-curve(u2)*amp;
    if(i2===0)x.moveTo(px,py);else x.lineTo(px,py);}
  x.stroke();

  // the read, running slightly ahead
  x.strokeStyle='rgba(232,144,60,.70)';x.lineWidth=1.3;
  x.setLineDash([5,5]);x.beginPath();
  for(var i3=0;i3<=N;i3++){var u3=i3/N;if(u3>Math.min(1,prog+0.085))break;
    var px3=x0+(x1-x0)*u3,py3=base-curve(u3-0.045)*amp*1.06;
    if(i3===0)x.moveTo(px3,py3);else x.lineTo(px3,py3);}
  x.stroke();x.setLineDash([]);

  // where they split
  var marks=[0.30,0.52,0.70];
  for(var m=0;m<marks.length;m++){
    var um=marks[m];if(um>prog-0.02)continue;
    var mx=x0+(x1-x0)*um,my=base-curve(um-0.045)*amp*1.06;
    x.strokeStyle='rgba(232,144,60,.55)';x.lineWidth=1;
    x.beginPath();x.moveTo(mx,my);x.lineTo(mx,base-curve(um)*amp);x.stroke();
    x.fillStyle='#E8903C';x.beginPath();x.arc(mx,my,3.4,0,6.2832);x.fill();
  }

  var hrs=['4P','6','8','10','CLOSE'];
  x.font='600 11px Archivo, Arial';x.letterSpacing='2.2px';
  x.fillStyle='rgba(201,189,176,.52)';
  for(var hI=0;hI<hrs.length;hI++){
    x.fillText(hrs[hI],x0+(x1-x0)*(hI/(hrs.length-1))-6,base+24);
  }
}

function loop(ts){fit();draw(ts/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
